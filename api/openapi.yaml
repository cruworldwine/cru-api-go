      x-cru-scope: bids:read
      security:
      - ClientKey: []
        ClientSecret: []
      - OAuth:
        - bids:read
      parameters:
      - name: status
        in: query
        required: false
        description: 'Comma-separated, e.g. matched,cancelled, from live, matched, complete, cancelled, expired
          and error, in any case. To see every bid, list all six: there is no all. Anything else is refused with
          VALIDATION_UNSUPPORTED_VALUE.'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - live
            - matched
            - complete
            - cancelled
            - expired
            - error
            default: live
      - name: lwin
        in: query
        required: false
        description: 'Only these wines: up to 20 comma-separated 18-digit LWIN18 codes.'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          maxItems: 20
      - name: client_ref
        in: query
        required: false
        description: Only bids with this client_ref, in any case. Older bids may share one.
        schema:
          type: string
          maxLength: 50
      - name: limit
        in: query
        required: false
        description: Number of bids to return. A larger value is refused with VALIDATION_INVALID_VALUE, not reduced.
        schema:
          type: integer
          minimum: 1
          maximum: 250
          default: 50
      - name: offset
        in: query
        required: false
