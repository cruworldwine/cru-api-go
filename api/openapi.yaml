# Cru Trading API v1, as implemented. The source the SDKs and the Postman collection are
# generated from. Change it in the same commit as the API change.
openapi: 3.0.3
info:
  title: Cru Trading API
  version: 1.0.0
  description: |-
    The Cru partner trading API as implemented: Cru's bid and offer books, the caller's own bids, offers, portfolio and trades, and the writes that trade.

    Every response is one envelope: status (OK or ERROR), message (for people, never branch on it), meta (version, timestamp, request_id, and pagination on paged lists) and data, with errors[] on a failure. Branch on the HTTP status and errors[].code. Paged lists take limit and offset and say meta.pagination.has_more.

    A partner credential (CLIENT-KEY and CLIENT-SECRET headers) writes at once and must send a reference, its idempotency key: a retry with the same reference never acts twice. A connected app (OAuth 2.0 bearer token) has its writes staged: the write answers 202 with a confirmation, and nothing happens until POST /confirmations/{code}.

    Amounts are plain numbers in the market's currency (1200.5 is 1,200.50), never minor units. Fields listed with x-extensible-enum may gain values: treat an unknown one as unknown, not as an error. New fields may appear in any response.
  contact:
    name: Cru World Wine
    url: https://developers.cruworldwine.com
servers:
- url: https://{market}.cruworldwine.com/api/v1
  description: Live. One host per market. A credential works on its own market only (AUTH_STORE_NOT_ALLOWED elsewhere).
  x-cru-environment: live
  variables:
    market:
      default: uk
      enum:
      - uk
      - us
      - hk
      - sg
      - eu
      - ae
      - cn
- url: https://{market}.crusandbox.com/api/v1
  description: The sandbox, for building and testing, where no real money or wine changes hands. The same markets as live, with credentials issued for the sandbox. GET /ping says environment test there.
  x-cru-environment: sandbox
  variables:
    market:
      default: uk
      enum:
      - uk
      - us
      - hk
      - sg
      - eu
      - ae
      - cn
# Each market's name, and the currency every amount on its host is in, with the symbol Cru's
# website shows for it. The SDKs carry this table, so a client knows its currency without a call.
x-cru-markets:
- code: uk
  name: United Kingdom
  currency: GBP
  symbol: £
- code: us
  name: United States
  currency: USD
  symbol: $
- code: hk
  name: Hong Kong
  currency: HKD
  symbol: HK$
- code: sg
  name: Singapore
  currency: SGD
  symbol: SG$
- code: eu
  name: Europe
  currency: EUR
  symbol: €
- code: ae
  name: United Arab Emirates
  currency: AED
  symbol: د.إ
- code: cn
  name: China
  currency: CNY
  symbol: ¥
security:
- ClientKey: []
  ClientSecret: []
- OAuth: []
tags:
- name: Account
- name: Warehouses
- name: Reference data
- name: Market data
- name: Your bids
- name: Your offers
- name: Your portfolio
- name: Buy and sell
- name: Your addresses
- name: Confirmations
paths:
  /ping:
    get:
      operationId: ping
      summary: Test authentication
      description: |-
        Confirm that your credentials work and see the account, market, currency, permissions and expiry they carry.

        **A simple first request.** This authenticated check returns your credential details without exposing any trading data.
      tags:
      - Account
      x-cru-sdk:
        resource: client
        method: ping
      x-cru-scope: meta:read
      security:
      - ClientKey: []
        ClientSecret: []
      - OAuth:
        - meta:read
      responses:
        '200':
          description: Fields returned in the data object.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /warehouses:
    get:
      operationId: listWarehouses
      summary: List warehouses
      description: |-
        The five Cru warehouses wine can be delivered into: codes, addresses, bond references, delivery instructions, and whether your inbond wine sells through each.

        **The codes every other endpoint uses.** A bid’s deliverable_warehouses, an offer’s warehouse_code and the warehouse.deliverable_warehouse_code of a listing or a portfolio line all use these five codes, and so does the warehouse.current_location_code of wine stored in one. Warehouses outside Cru, where your wine may be stored, are GET /warehouses/inbond: an inbond_address_id is never a warehouse_code.
      tags:
      - Warehouses
      x-cru-sdk:
        resource: warehouses
        method: list
      x-cru-scope: meta:read
      security:
      - ClientKey: []
        ClientSecret: []
      - OAuth:
        - meta:read
      responses:
        '200':
          description: 'data.warehouses is an array, always in the same order: UK, HK, SG, FR, US. The last three
            fields are yours: what each warehouse means for wine you hold outside Cru.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWarehousesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /warehouses/{code}:
    get:
      operationId: getWarehouse
      summary: Retrieve a warehouse
      description: 'One Cru warehouse by its code, such as UK_DRAK: name, market, address, bond references, delivery
        instructions, and whether your inbond wine sells through it.'
      tags:
      - Warehouses
      x-cru-sdk:
        resource: warehouses
        method: get
      x-cru-scope: meta:read
      security:
      - ClientKey: []
        ClientSecret: []
      - OAuth:
        - meta:read
      parameters:
      - name: code
        in: path
        required: true
        description: UK_DRAK, HK_KERRY, SG_TOLL, FR_DARTESS, US_NAPA. Case-insensitive.
        schema:
          type: string
      responses:
        '200':
          description: Fields returned in data.warehouse.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWarehouseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /warehouses/inbond:
    get:
      operationId: listInbondWarehouses
      summary: List inbond warehouses
      description: |-
        Warehouses outside Cru where your wine may be stored, by inbond_address_id: where wine held outside Cru is now, and what an inbond address points at.

        **Not Cru’s own warehouses.** This is the Cru website’s “Where is it now?” list. Your listings and portfolio lines in one carry IB_ and its inbond_address_id, such as IB_20, as warehouse.current_location_code. The five Cru warehouses wine is delivered into are GET /warehouses, by warehouse_code: an inbond_address_id is never a warehouse_code.
      tags:
      - Warehouses
      x-cru-sdk:
        resource: inbond_warehouses
        method: list
      x-cru-scope: meta:read
      security:
      - ClientKey: []
        ClientSecret: []
      - OAuth:
        - meta:read
      responses:
        '200':
          description: 'data.inbond_warehouses is an array in the order the Cru website lists them: those in GB,
            then FR, SG, HK and US, then everywhere else — each group by name — then any you suggested that Cru
            has not approved yet.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInbondWarehousesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: suggestInbondWarehouse
      summary: Suggest an inbond warehouse
      description: |-
        Suggest a warehouse outside Cru that GET /warehouses/inbond does not list. Until Cru approves it, only you see it and can use its inbond_address_id.

        **Only with warehouses:suggest, which Cru grants.** A suggestion adds to the list every customer picks from, so Cru grants warehouses:suggest itself, on a partner credential, and never to a connected app: ask Cru to enable it. Without it, the customer emails customerservice@cruworldwine.com and Cru adds the warehouse, as the Cru website says.

        **Check the list first.** A warehouse Cru already lists, or one you already suggested — the same name in the same country, ignoring case and punctuation — is refused with its inbond_address_id. Five can wait for Cru at a time.

        **Yours alone until Cru approves it.** It is saved hidden. Until Cru approves it, it is in your GET /warehouses/inbond with pending true, and its inbond_address_id works for you — for wine held outside Cru, or an inbond address — and nobody else. To save an inbond address there, give its street, city and postcode.
      tags:
      - Warehouses
      x-cru-sdk:
        resource: inbond_warehouses
        method: suggest
      x-cru-scope: warehouses:suggest
      security:
      - ClientKey: []
        ClientSecret: []
      - OAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestInbondWarehouseRequest'
      x-cru-action: inbond_warehouse.suggest
      responses:
        '201':
          description: 'Fields returned in data: what was done, and the warehouse.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestInbondWarehouseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /warehouses/inbond/{id}:
    get:
      operationId: getInbondWarehouse
      summary: Retrieve an inbond warehouse
      description: 'One inbond warehouse by its inbond_address_id: its name, company, address, phone, London City
        Bond site code, and whether it is bonded.'
      tags:
      - Warehouses
      x-cru-sdk:
        resource: inbond_warehouses
        method: get
      x-cru-scope: meta:read
      security:
      - ClientKey: []
        ClientSecret: []
      - OAuth:
        - meta:read
      parameters:
      - name: id
        in: path
        required: true
        description: The inbond_address_id, from GET /warehouses/inbond.
        schema:
          type: integer
      responses:
        '200':
          description: Fields returned in data.inbond_warehouse.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInbondWarehouseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /wines:
    get:
      operationId: searchWines
      summary: Search wines
      description: |-
        Find wines by name and get their LWIN18 codes, with producer, region, pack size, product page, Cru’s market price and the best bids and offers.

        **Start here to find an LWIN18.** Every other endpoint identifies a wine by its LWIN18. This searches the way the Cru website does, best match first.

        **No total, and at most 100 matches.** meta.pagination has has_more but no total, and the search considers its 100 best matches: paging past them finds nothing more. Narrow the words, vintage or pack instead.

        **Bids and offers come with market:read.** A credential that also holds market:read gets each wine’s best five bids and five offers, from the books rather than the search. With wines:read alone, the wine comes without those two keys.
      tags:
      - Reference data
      x-cru-sdk:
        resource: wines
        method: search
        paged: true
      x-cru-scope: wines:read
      security:
      - ClientKey: []
        ClientSecret: []
      - OAuth:
        - wines:read
      parameters:
      - name: q
        in: query
        required: true
        description: 'Words from the wine name, such as “Petrus Pomerol”: one to six words of two or more characters.'
        schema:
          type: string
          maxLength: 100
      - name: vintage
        in: query
        required: false
        description: Only this vintage.
        schema:
          type: integer
          minimum: 1800
          maximum: 2100
      - name: pack_size
        in: query
        required: false
        description: 'Only this pack, written as bottles x size: 12x75cl, 6x150cl.'
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Number of wines to return. A larger value is refused with VALIDATION_INVALID_VALUE, not reduced.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 25
      - name: offset
        in: query
        required: false
        description: Number of wines to skip.
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: data.wines, and data.currency — the currency of every price in them.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchWinesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /wines/{lwin18}:
    get:
      operationId: getWine
      summary: Retrieve a wine
      description: |-
        One wine by LWIN18: producer, country, region, critic score, drinking window, market price, last trade, and every bid and offer on it.

        **Every level of both books.** With market:read as well as wines:read, the wine carries all its bids and offers — empty lists when it has none. The wine is returned either way.
      tags:
      - Reference data
      x-cru-sdk:
        resource: wines
        method: get
      x-cru-scope: wines:read
      security:
      - ClientKey: []
        ClientSecret: []
      - OAuth:
        - wines:read
      parameters:
      - name: lwin18
        in: path
        required: true
        description: The wine’s LWIN18. Find one by name with GET /wines.
        schema:
          type: string
          pattern: ^[0-9]{18}$
      responses:
        '200':
          description: 'Fields returned in data.wine: every search field, then these.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWineResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /market:
    get:
      operationId: listMarket
      summary: List the market
      description: |-
        Both sides of Cru’s market in one call: every wine with a bid or an offer, each with its bids and its offers.

        **Both books, one entry per wine.** Bids are net — what a seller receives. Offers are gross — what a buyer pays. They are the same objects as /market/bids and /market/offers, read from the same books.

        **Either side can be empty.** A wine is listed when it has a bid or an offer, so one of its two lists is often empty. Wines come by LWIN18, ascending, and pagination counts wines.
      tags:
      - Market data
      x-cru-sdk:
        resource: market
        method: list
        paged: true
      x-cru-scope: market:read
      security:
      - ClientKey: []
        ClientSecret: []
      - OAuth:
        - market:read
      parameters:
      - name: limit
        in: query
        required: false
        description: Number of wines to return. A larger value is refused with VALIDATION_INVALID_VALUE, not reduced.
        schema:
          type: integer
          minimum: 1
          maximum: 250
          default: 100
      - name: offset
        in: query
        required: false
        description: Number of wines to skip.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: lwin
        in: query
        required: false
        description: 'Only these wines: up to 20 comma-separated 18-digit LWIN18 codes. One that is not 18 digits
          is refused with VALIDATION_INVALID_VALUE.'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          maxItems: 20
      - name: depth
        in: query
        required: false
        description: 'How many bids and how many offers to return per wine, best first: bids in book order, offers
          cheapest first. Omit it for every level. Default: every level.'
        schema:
          type: integer
          minimum: 1
      - name: include_market_price
        in: query
        required: false
        description: Add market_price — Cru’s market price for the wine, as a number — to each wine.
        schema:
          type: boolean
          default: false
      - name: include_last_trade
        in: query
        required: false
        description: Add last_trade — the last traded price and when — to each wine.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Each item in data.markets carries the wine, its bids and its offers.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMarketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /market/wines/{lwin18}:
    get:
      operationId: getMarketWine
      summary: Retrieve the market for one wine
      description: |-
        Both sides of the market on one wine, by LWIN18: its bids and its offers in one object, without paging.

        **One entry of GET /market.** Bids are net — what a seller receives. Offers are gross — what a buyer pays. To filter either side by price or stock, use the wine’s /bids or /offers instead.

        **An empty side is an empty list.** A wine Cru knows is always described, even with nothing on either side: bids and offers are then empty lists. Only a wine Cru does not know is NOT_FOUND / 404.
      tags:
      - Market data
      x-cru-sdk:
        resource: market
        method: get_wine
      x-cru-scope: market:read
      security:
      - ClientKey: []
        ClientSecret: []
      - OAuth:
        - market:read
      parameters:
      - name: lwin18
        in: path
        required: true
        description: The wine’s LWIN18. Find one by name with GET /wines.
        schema:
          type: string
          pattern: ^[0-9]{18}$
      - name: depth
        in: query
        required: false
        description: 'How many bids and how many offers to return per wine, best first: bids in book order, offers
          cheapest first. Omit it for every level. Default: every level.'
        schema:
          type: integer
          minimum: 1
      - name: include_market_price
        in: query
        required: false
        description: Add market_price — Cru’s market price for the wine, as a number — to each wine.
        schema:
          type: boolean
          default: false
      - name: include_last_trade
        in: query
        required: false
        description: Add last_trade — the last traded price and when — to each wine.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: data.market is one wine, exactly as an item of GET /market.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMarketWineResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /market/bids:
    get:
      operationId: listMarketBids
      summary: List market bids
      description: |-
        Explore Cru’s live bid book: what buyers will pay for each wine, net of commission, and the stock each bid accepts.

        **A bid is an opportunity to sell.** Bid prices are net of Cru’s commission: what a seller receives. Read the requirements on each bid to see which stock can fill it.

        **Pagination counts wines, not bids.** limit, offset and total refer to wines. Each wine carries every bid on it unless you set depth.

        **Book order puts Cru’s own bids first.** Wines with a Cru bid come first, newest first, then by best bid. Within a wine, Cru’s bids lead, then the rest highest first — so depth=1 is not always the best price.
      tags:
      - Market data
      x-cru-sdk:
        resource: market
        method: list_bids
        paged: true
      x-cru-scope: market:read
      security:
      - ClientKey: []
        ClientSecret: []
      - OAuth:
        - market:read
      parameters:
      - name: limit
        in: query
        required: false
        description: Number of wines to return. A larger value is refused with VALIDATION_INVALID_VALUE, not reduced.
        schema:
          type: integer
          minimum: 1
          maximum: 250
          default: 100
      - name: offset
        in: query
        required: false
        description: Number of wines to skip.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: lwin
        in: query
        required: false
        description: 'Only these wines: up to 20 comma-separated LWIN18 codes. The books do not check the format,
          so a code that is not an LWIN18 simply matches nothing.'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          maxItems: 20
      - name: wine_name
        in: query
        required: false
        description: Only wines whose name contains every word given, such as “Lafite 2010”. One to six words of
          two or more characters.
        schema:
          type: string
          maxLength: 100
      - name: min_price
        in: query
        required: false
        description: Lowest price to include, inclusive, in whole units of the market’s currency — 1200 is 1,200.00.
          Compared with the net bid price.
        schema:
          type: integer
          minimum: 0
      - name: max_price
        in: query
        required: false
        description: Highest price to include, inclusive, in whole units of the market’s currency — 1200 is 1,200.00.
          Compared with the net bid price.
        schema:
          type: integer
          minimum: 0
      - name: depth
        in: query
        required: false
