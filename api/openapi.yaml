    InbondAddress:
      type: object
      required:
      - inbond_address_id
      - name
      - company
      - street
      - city
      - region
      - postcode
      - country
      - telephone
      - lcb_site_code
      - is_bonded
      - account_number
      - site_code
      - nickname
      - pending
      properties:
        inbond_address_id:
          description: The inbond warehouse, as GET /warehouses/inbond lists it.
          type: integer
        name:
          description: The warehouse’s name, such as Seckfords.
          type: string
        company:
          description: The company that runs it.
          type: string
          nullable: true
        street:
          description: Its street address, both lines joined with ", ".
          type: string
          nullable: true
        city:
          description: Its town or city.
          type: string
          nullable: true
        region:
          description: Its county, state or region.
          type: string
          nullable: true
        postcode:
          description: Its postcode.
          type: string
          nullable: true
        country:
          description: An ISO country code, such as GB.
          type: string
          nullable: true
        telephone:
          description: Its phone number.
          type: string
          nullable: true
        lcb_site_code:
          description: Its London City Bond site code, such as MM for LCB Melksham. Null for most.
          type: string
          nullable: true
        is_bonded:
          description: Whether it is bonded. A few are duty-paid storage, which cannot be an inbond address.
          type: boolean
        account_number:
          description: Your bond account number at that warehouse.
          type: string
          nullable: true
        site_code:
          description: Your own site code or sub-account there, where the warehouse uses one. Not its lcb_site_code.
          type: string
          nullable: true
        nickname:
          description: Your own name for the address.
          type: string
          nullable: true
        pending:
          description: True while Cru has not approved a warehouse you suggested.
          type: boolean
    InbondAddressResult:
      type: object
