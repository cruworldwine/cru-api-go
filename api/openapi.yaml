    LastTrade:
      type: object
      required:
      - price
      - traded_at
      properties:
        price:
          description: The last traded price, in the market's currency.
          type: number
        traded_at:
          description: When it traded, RFC 3339 UTC.
          type: string
          format: date-time
    LinePricing:
      type: object
      required:
      - cost
      - listing_price
      - commission_percent
      - commission
      - settlement_fee
      - net_proceeds
      properties:
        cost:
          description: What you paid per unit. Null for a supplier’s own stock, and when it cannot be converted.
          type: number
          nullable: true
        listing_price:
          description: 'The asking price per unit while the units are listed; otherwise null. For a supplier’s own
            stock and BPO stock, the same as pricing.net_proceeds: Cru takes no commission from a supplier, and
            adds its margin for buyers instead.'
          type: number
          nullable: true
        commission_percent:
          description: 'Cru’s commission, as a percent of pricing.listing_price: 5.0 is 5%. 0.0 for a supplier’s
            own stock and BPO stock, as Cru takes no commission from a supplier. Null while the line is not listed.'
          type: number
          nullable: true
        commission:
          description: 'Cru’s commission per unit: pricing.listing_price less pricing.commission and pricing.settlement_fee
            is pricing.net_proceeds, to the cent. 0.0 for a supplier’s own stock and BPO stock. Null while the line
            is not listed.'
          type: number
          nullable: true
        settlement_fee:
          description: For wine held outside Cru, the settlement fee per unit of the Cru warehouse it is sold through;
            0.0 for every other stock_type. Null while the line is not listed.
          type: number
          nullable: true
        net_proceeds:
          description: What you receive per unit when the line sells, pricing.listing_price less pricing.commission
            and pricing.settlement_fee. Null while it is not listed. Units listed at one price can carry different
            commissions, so a line gives the lowest, with that unit’s commission_percent, commission and settlement_fee.
            For a supplier’s own offers, the supplier’s own price; for BPO stock, the purchase order’s cost.
          type: number
          nullable: true
    LineWarehouse:
      type: object
      required:
      - location_type
      - current_location
      - current_location_code
      - deliverable_warehouse_code
      properties:
        location_type:
          description: 'What kind of place it is: cru (a Cru warehouse), inbond (an inbond warehouse outside Cru),
            address (your own address) or supplier (a supplier’s own stock). Null when you told Cru you do not know
            where the wine is. Not to be confused with the line’s stock_type.'
          type: string
          nullable: true
          x-extensible-enum:
          - cru
          - inbond
          - address
          - supplier
        current_location:
          description: 'The name of where the wine is now, as the Cru website shows it: a warehouse''s name; for
            wine at your own address, its street lines, which can run over several lines; “Your warehouse” for a
            supplier''s own stock; or “Don''t Know” when you told Cru you do not know where it is.'
          type: string
          nullable: true
        current_location_code:
          description: 'Where the wine is now, as a code to give the current_location_code filter. For wine stored
            with Cru, the Cru warehouse’s code from GET /warehouses, the same as its deliverable_warehouse_code.
            For wine in an inbond warehouse outside Cru, IB_ and that warehouse’s inbond_address_id, such as IB_20:
            the writes and GET /warehouses/inbond/{id} take the number alone. Every inbond warehouse has one, even
            one GET /warehouses/inbond does not list and so may not find by its id. For wine at your own address,
            ADDR_ and the address’s id, such as ADDR_123: no endpoint lists address ids, so this is where to find
            them. Null for a supplier’s own stock, wine whose current_location is “Don''t Know”, and wine stored
            with Cru in a warehouse with no Cru code.'
          type: string
          nullable: true
        deliverable_warehouse_code:
          description: 'The Cru warehouse the wine can be delivered from, the code bids list as deliverable_warehouses:
            the one it is in or, for wine held outside Cru, the one it goes to once sold. Your own wine outside
            Cru has one only while it is listed. A supplier’s own stock and BPO stock always have one, which for
            stock at the supplier’s own warehouse is the Cru warehouse in its country. Null for wine stored with
            Cru in a warehouse with no Cru code, which cannot fill a bid. Given to GET /market/bids as deliverable_warehouse,
            it finds the bids the wine can fill.'
          type: string
          nullable: true
