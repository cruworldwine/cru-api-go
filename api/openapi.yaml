          maxItems: 20
      - name: status
        in: query
        required: false
        description: 'Only sales in any of these states, comma-separated, in any case: transfer_needed, awaiting_transfer,
          on_purchase_order or delivered_to_cru. Anything else is refused with VALIDATION_UNSUPPORTED_VALUE.'
