      - status
      properties:
        lwin18:
          description: 'The 18-digit LWIN: wine, vintage and pack together. Match on all 18 digits.'
          type: string
        wine_name:
          description: Cru’s name for the wine.
          type: string
          nullable: true
        vintage:
          description: The vintage year. 1000 means non-vintage.
          type: integer
          nullable: true
        pack_size:
          description: Pack format, for example 6x75cl.
          type: string
          nullable: true
        quantity:
          description: 'Always 1: each unit sold is its own sale.'
          type: integer
        price:
          description: 'What the unit sold for, the Sold list’s Sold For. For wine held outside Cru, that is after
            Cru’s commission: sold_price less commission. For wine stored with Cru it is usually sold_price, but
            can differ, such as when the unit sold into a bid at another price.'
          type: number
          nullable: true
        total:
          description: The same as price, for one unit.
          type: number
          nullable: true
        currency:
          description: 'The market’s. Every amount on a sale is in it: one bought or sold in another currency is
            converted at the rate of that day.'
          type: string
          x-extensible-enum:
          - GBP
          - USD
          - HKD
          - SGD
          - EUR
          - AED
          - CNY
        reference:
          description: 'Always null: a sale has no order number.'
          nullable: true
          type: string
        traded_at:
          description: When it sold, RFC 3339 UTC.
          type: string
          format: date-time
          nullable: true
        cru_id:
          description: The unit’s Cru ID.
          type: integer
          nullable: true
        transfer_ref:
          description: The transfer that brings it to Cru, such as SM00004417, once one is booked.
          type: string
          nullable: true
        cost:
          description: What you paid for it. null when no cost is recorded.
          type: number
          nullable: true
        sold_price:
          description: The price Cru’s commission was worked out from, before the commission and any settlement_fee.
            For wine stored with Cru, its listing price, fixed on the unit when it was listed.
          type: number
          nullable: true
        commission_percent:
          description: Cru’s commission, as a percentage of sold_price. 0.0 for a supplier.
          type: number
        commission:
          description: Cru’s commission, as an amount.
          type: number
          nullable: true
        settlement_fee:
          description: The warehouse’s fee, for wine held outside Cru. 0.0 for wine stored with Cru.
          type: number
          nullable: true
        net_proceeds:
          description: 'What you received, the Sold list’s You Received: sold_price less commission and settlement_fee.'
          type: number
          nullable: true
        profit_loss:
          description: net_proceeds less cost. null when cost is.
          type: number
          nullable: true
        profit_loss_percent:
          description: profit_loss as a percentage of cost, to one decimal place. null when no cost is recorded.
          type: number
          nullable: true
        deliver_to:
          description: For wine held outside Cru, the name of the Cru warehouse it goes to. null for wine stored
            with Cru.
          type: string
          nullable: true
        deliverable_warehouse_code:
          description: 'That warehouse’s code: UK_DRAK, HK_KERRY, SG_TOLL, FR_DARTESS, US_NAPA. null for wine stored
            with Cru.'
          type: string
          nullable: true
        deliver_by:
          description: 'For wine held outside Cru, when it is due there, YYYY-MM-DD: its transfer’s expected date
            or, without one, two weeks after it sold. null for wine stored with Cru.'
          type: string
          format: date
          nullable: true
        status:
          description: 'Where the wine is in reaching Cru, as the status filter takes it: transfer_needed, awaiting_transfer,
            on_purchase_order or delivered_to_cru. Wine stored with Cru is always delivered_to_cru.'
          type: string
          nullable: true
          x-extensible-enum:
          - transfer_needed
          - awaiting_transfer
          - on_purchase_order
          - delivered_to_cru
