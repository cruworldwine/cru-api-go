  /confirmations/{code}:
    get:
      operationId: getConfirmation
      summary: Retrieve a confirmation
      description: |-
        See what a confirmation code stands for and how far it has got: pending, executing, completed, failed, expired or cancelled.

        **Connected apps only.** Confirmations belong to the app that staged them. A partner credential never has one, and gets CONFIRMATION_NOT_FOUND.
      tags:
      - Confirmations
      x-cru-sdk:
        resource: confirmations
        method: get
      security:
      - OAuth: []
      parameters:
      - name: code
        in: path
        required: true
        description: The cnf_ code a connected app’s write returned. URL-encode it as a single path segment.
        schema:
          type: string
      responses:
        '200':
          description: Fields returned in data. Reading a pending code past its expiry marks it expired.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConfirmationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: confirmInstruction
      summary: Confirm an instruction
      description: |-
        Carry out an instruction a connected app staged. Only the same app, for the same customer and market, can confirm it.

        **Only after the customer says yes.** This is the call that trades with the customer’s money or wine. Show them preview.summary and confirm only on their explicit yes.
      tags:
      - Confirmations
      x-cru-sdk:
        resource: confirmations
        method: confirm
      security:
      - OAuth: []
      parameters:
      - name: code
        in: path
        required: true
        description: The cnf_ code a connected app’s write returned. URL-encode it as a single path segment.
        schema:
          type: string
      responses:
        '200':
          description: 'The action’s own result: 201 for bid.place, offer.list, bid.buy and inbond_address.add,
            200 for the rest. A repeat replays it with Idempotent-Replayed: true.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmInstructionResponse'
        '201':
          description: 'The action’s own result: 201 for bid.place, offer.list, bid.buy and inbond_address.add,
            200 for the rest. A repeat replays it with Idempotent-Replayed: true.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmInstructionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: cancelConfirmation
      summary: Discard an instruction
      description: Withdraw a pending instruction before it is confirmed. It answers 204 with no body, and the code
        cannot be used again.
      tags:
      - Confirmations
      x-cru-sdk:
        resource: confirmations
        method: cancel
      security:
      - OAuth: []
      parameters:
      - name: code
        in: path
        required: true
        description: The cnf_ code a connected app’s write returned. URL-encode it as a single path segment.
        schema:
          type: string
      responses:
        '204':
          description: Cancelled. No body.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    ClientKey:
      type: apiKey
      in: header
      name: CLIENT-KEY
      description: A partner credential's key. Always sent with CLIENT-SECRET.
    ClientSecret:
      type: apiKey
      in: header
      name: CLIENT-SECRET
      description: A partner credential's secret, shown once when it is issued.
    OAuth:
      type: oauth2
      description: 'A connected app acting for a Cru customer: authorization code with PKCE (S256), then refresh
        tokens. Its writes are staged for confirmation. The endpoints are on each market''s host; the UK''s are
        shown.'
      flows:
        authorizationCode:
          authorizationUrl: https://uk.cruworldwine.com/api/oauth/authorize
          tokenUrl: https://uk.cruworldwine.com/api/oauth/token
          refreshUrl: https://uk.cruworldwine.com/api/oauth/token
          scopes:
            meta:read: Check the connection, and read Cru’s warehouses and the inbond warehouses
            market:read: Read Cru’s bid and offer books, and the bids and offers on each wine
            wines:read: Look up wine reference data
            portfolio:read: Read your portfolio
            bids:read: Read your own bids
            offers:read: Read your own listings, with what the listed wine cost
            trades:read: Read what you have bought and sold, with the order and invoice references
            addresses:read: Read your own inbond addresses
            bids:write: Place, change, renew and cancel bids
            offers:write: List, change and remove offers
            orders:write: Buy and sell straight away, alongside bids:write or offers:write
            addresses:write: Save and remove inbond addresses
  headers:
    X-Request-Id:
      description: 'The id this request is traced by. Send your own (8-64 of A-Z a-z 0-9 . _ : -) to have it used.'
      schema:
        type: string
    Idempotent-Replayed:
      description: true when this is the stored answer to an earlier request with the same reference, not a new
        action.
      schema:
        type: string
        enum:
        - 'true'
  responses:
    BadRequest:
      description: 'The request could not be understood: VALIDATION_UNKNOWN_PARAMETER, VALIDATION_MALFORMED_BODY.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 'Authentication failed: AUTH_INVALID_CREDENTIALS.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 'Not permitted: AUTH_CLIENT_SUSPENDED, AUTH_INSUFFICIENT_SCOPE, AUTH_IP_NOT_ALLOWED, AUTH_HTTPS_REQUIRED,
        AUTH_STORE_NOT_ALLOWED, AUTH_ACCOUNT_ON_HOLD.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 'Not found: NOT_FOUND, BID_NOT_FOUND, OFFER_NOT_FOUND, CONFIRMATION_NOT_FOUND, API_VERSION_UNSUPPORTED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: 'Method not allowed: METHOD_NOT_ALLOWED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Allow:
          description: The methods the URL takes.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 'Conflict: REQUEST_IN_PROGRESS, PRICE_CHANGED, CONFIRMATION_LIMIT_REACHED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: 'Gone: CONFIRMATION_EXPIRED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: 'Validation failed: VALIDATION_REQUIRED_FIELD, VALIDATION_INVALID_VALUE, VALIDATION_UNSUPPORTED_VALUE,
        TRADE_REFUSED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 'Too many requests: RATE_LIMIT_EXCEEDED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 'Unexpected error: INTERNAL_ERROR.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 'Temporarily unavailable: SERVICE_UNAVAILABLE.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AddInbondAddressRequest:
      type: object
      required:
      - inbond_address_id
      - account_number
      properties:
        reference:
          description: 'Your idempotency key: letters and digits, then . _ : or - allowed. Required on a partner
            credential’s write and kept for good, so a retry with it can never act twice. Ignored for connected
            apps.'
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          x-cru-required-for: partner
        inbond_address_id:
          description: 'A bonded warehouse from GET /warehouses/inbond: not one of the duty-paid ones, whose is_bonded
            is false.'
          type: integer
          minimum: 1
        account_number:
          description: Your bond account number at that warehouse.
          type: string
          maxLength: 50
        site_code:
          description: Your site code or sub-account there, if the warehouse uses one.
          type: string
          maxLength: 50
        nickname:
          description: Your own name for the address.
          type: string
          maxLength: 50
      additionalProperties: false
    AddInbondAddressResponse:
      type: object
      required:
      - status
      - message
      - meta
      - data
      properties:
        status:
          description: OK on success, ERROR on failure. It describes the call, never a resource.
          type: string
          enum:
          - OK
        message:
          description: 'A sentence for people. It is not stable: never branch on it.'
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          $ref: '#/components/schemas/InbondAddressResult'
    ApiClient:
      type: object
      required:
      - environment
      - key_prefix
      - organisation
      - label
      - market
      - currency
      - scopes
      - expires_at
      properties:
        environment:
          description: live on production, test everywhere else.
          type: string
        key_prefix:
          description: The start of the client key that called, such as cru_live_ABCD... Null for a connected app.
          type: string
          nullable: true
        organisation:
          description: The account the credential acts for.
          type: string
          nullable: true
        label:
          description: The credential’s label, or the connected app’s registered name.
          type: string
          nullable: true
        market:
          description: The market you called, such as uk.
          type: string
          x-extensible-enum:
          - uk
          - us
          - hk
          - sg
          - eu
          - ae
          - cn
          - fr
        currency:
          description: ISO 4217 currency prices are quoted in on this market.
          type: string
          x-extensible-enum:
          - GBP
          - USD
          - HKD
          - SGD
          - EUR
          - AED
          - CNY
        scopes:
          description: The scopes granted.
          type: array
          items:
            type: string
        expires_at:
          description: When the credential expires, or null if it does not. For a connected app, when the access
            token expires.
          type: string
          format: date-time
          nullable: true
    BidRequirements:
      type: object
      required:
      - condition_status
      - landed_stock_only
      - deliverable_warehouses
      properties:
        condition_status:
          description: 'The lowest condition the bid accepts: verified, client_reserves or apd.'
          type: string
          x-extensible-enum:
          - verified
          - client_reserves
          - apd
        landed_stock_only:
          description: Whether only stock that has already landed can fill it.
          type: boolean
        deliverable_warehouses:
          description: 'The Cru warehouses stock can be in, or be delivered to, to fill it: the codes GET /warehouses
            lists.'
          type: array
          items:
            type: string
    BidResult:
      type: object
      description: 'A bid write''s result: the bid as GET /bids/{code} returns it now.'
      required:
      - action
      - status
      - bid
      properties:
        action:
          description: The action that ran.
          type: string
          x-extensible-enum:
          - bid.place
          - bid.update
          - bid.cancel
          - bid.renew
          - bid.buy
          - offer.list
          - offer.update
          - offer.remove
          - offer.sell
          - inbond_address.add
          - inbond_address.remove
          - inbond_warehouse.suggest
        status:
          description: completed.
          type: string
          x-extensible-enum:
          - completed
        bid:
          $ref: '#/components/schemas/OwnBid'
    BuyMarketOfferRequest:
      type: object
      required:
      - quantity
      properties:
        reference:
          description: 'Your idempotency key: letters and digits, then . _ : or - allowed. Required on a partner
            credential’s write and kept for good, so a retry with it can never act twice. Ignored for connected
            apps.'
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          x-cru-required-for: partner
        quantity:
          description: 'Units to buy: at least the offer’s min_quantity, and no more than it has.'
          type: integer
          minimum: 1
          maximum: 1000
        max_price:
          description: The highest price per unit you will pay, in the market’s currency — price as GET /market/offers
            shows it — to at most 2 decimal places.
          type: number
          minimum: 0
          exclusiveMinimum: true
      additionalProperties: false
    BuyMarketOfferResponse:
      type: object
      required:
      - status
      - message
      - meta
      - data
      properties:
        status:
          description: OK on success, ERROR on failure. It describes the call, never a resource.
          type: string
          enum:
          - OK
        message:
          description: 'A sentence for people. It is not stable: never branch on it.'
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          $ref: '#/components/schemas/BuyResult'
    BuyResult:
      type: object
      description: The result of buying an offer.
      required:
      - action
      - status
      - order
      - lwin18
      - quantity
      - price
      properties:
        action:
          description: The action that ran.
          type: string
          x-extensible-enum:
          - bid.place
          - bid.update
          - bid.cancel
          - bid.renew
          - bid.buy
          - offer.list
          - offer.update
          - offer.remove
          - offer.sell
          - inbond_address.add
          - inbond_address.remove
          - inbond_warehouse.suggest
        status:
          description: completed.
          type: string
          x-extensible-enum:
          - completed
        order:
          $ref: '#/components/schemas/Order'
        lwin18:
          description: The wine.
          type: string
        quantity:
          description: Units bought.
          type: integer
        price:
          description: Per unit.
          type: number
    CancelBidRequest:
      type: object
      properties:
        reference:
          description: 'Your idempotency key: letters and digits, then . _ : or - allowed. Required on a partner
            credential’s write and kept for good, so a retry with it can never act twice. Ignored for connected
            apps.'
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          x-cru-required-for: partner
      additionalProperties: false
    CancelBidResponse:
      type: object
      required:
      - status
      - message
      - meta
      - data
      properties:
        status:
          description: OK on success, ERROR on failure. It describes the call, never a resource.
          type: string
          enum:
          - OK
        message:
          description: 'A sentence for people. It is not stable: never branch on it.'
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          $ref: '#/components/schemas/BidResult'
    ConfirmInstructionResponse:
      type: object
      required:
      - status
      - message
      - meta
      - data
      properties:
        status:
          description: OK on success, ERROR on failure. It describes the call, never a resource.
          type: string
          enum:
          - OK
        message:
          description: 'A sentence for people. It is not stable: never branch on it.'
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          $ref: '#/components/schemas/InstructionResult'
    Confirmation:
      type: object
      required:
      - action
      - status
      - preview
      - expires_at
      properties:
        action:
          description: The action staged.
          type: string
          x-extensible-enum:
          - bid.place
          - bid.update
          - bid.cancel
          - bid.renew
          - bid.buy
          - offer.list
          - offer.update
          - offer.remove
          - offer.sell
          - inbond_address.add
          - inbond_address.remove
          - inbond_warehouse.suggest
        status:
          description: pending, executing, completed, failed, expired or cancelled.
          type: string
          x-extensible-enum:
          - pending
          - executing
          - completed
          - failed
          - expired
          - cancelled
        preview:
          $ref: '#/components/schemas/Preview'
        expires_at:
          description: RFC 3339 UTC.
          type: string
          format: date-time
          nullable: true
        result:
          description: 'What the instruction did: the same payload confirming it returned. Present once completed.'
          type: object
          additionalProperties: true
        error:
          description: code and message of the refusal. Present once failed.
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              x-extensible-enum:
              - VALIDATION_UNKNOWN_PARAMETER
              - VALIDATION_MALFORMED_BODY
              - VALIDATION_REQUIRED_FIELD
              - VALIDATION_INVALID_VALUE
              - VALIDATION_UNSUPPORTED_VALUE
              - AUTH_INVALID_CREDENTIALS
              - AUTH_CLIENT_SUSPENDED
              - AUTH_INSUFFICIENT_SCOPE
              - AUTH_IP_NOT_ALLOWED
              - AUTH_HTTPS_REQUIRED
              - AUTH_STORE_NOT_ALLOWED
              - AUTH_ACCOUNT_ON_HOLD
              - NOT_FOUND
              - BID_NOT_FOUND
              - OFFER_NOT_FOUND
              - CONFIRMATION_NOT_FOUND
              - METHOD_NOT_ALLOWED
              - API_VERSION_UNSUPPORTED
              - REQUEST_IN_PROGRESS
              - PRICE_CHANGED
              - CONFIRMATION_LIMIT_REACHED
              - CONFIRMATION_EXPIRED
              - TRADE_REFUSED
              - RATE_LIMIT_EXCEEDED
              - INTERNAL_ERROR
              - SERVICE_UNAVAILABLE
            message:
              type: string
              nullable: true
    CreateOfferRequest:
      type: object
      required:
      - stock_type
      - quantity
      - price
      properties:
        reference:
          description: 'Your idempotency key: letters and digits, then . _ : or - allowed. Required on a partner
            credential’s write and kept for good, so a retry with it can never act twice. Ignored for connected
            apps.'
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          x-cru-required-for: partner
        stock_type:
          description: 'What you are listing: cru, a line of your portfolio stored with Cru; external, wine you
            hold outside Cru; or supplier, your own stock as a supplier whose offer feed Cru imports. The fields
            below that say which of them they are for are refused for the others, with VALIDATION_UNKNOWN_PARAMETER.
            Anything else, bpo included, is refused with VALIDATION_INVALID_VALUE: BPO stock cannot be listed through
            the API.'
          type: string
          enum:
          - cru
          - external
          - supplier
        portfolio_id:
          description: 'The line to list, from GET /portfolio: one with stock_type cru that is not listed yet (is_listed
            false). Its units go on sale as a listed line with a portfolio_id of its own, which the answer gives.
            Only with stock_type cru.'
          type: string
          x-cru-when:
            stock_type:
            - cru
          x-cru-required-when: true
        lwin18:
          description: The wine. Cru must trade it. Only with stock_type external or supplier.
          type: string
          pattern: ^[0-9]{18}$
          x-cru-when:
            stock_type:
            - external
            - supplier
          x-cru-required-when: true
        quantity:
          description: Units to list. For cru, at most the line’s quantity.
          type: integer
          minimum: 1
          maximum: 1000
        price:
          description: 'Price per unit in the market’s currency, to at most 2 decimal places. For cru and external,
            the asking price, what the buyer pays: the line’s pricing.listing_price. For supplier, what you receive:
            buyers pay Cru’s price, and the line gives yours as both pricing.listing_price and pricing.net_proceeds.'
          type: number
          minimum: 0
          exclusiveMinimum: true
        warehouse_code:
          description: 'The Cru warehouse it is sold through: one GET /warehouses marks sells_your_inbond_wine for
            you. The line gives it back as warehouse.deliverable_warehouse_code. Only with stock_type external.'
          type: string
          x-cru-when:
            stock_type:
            - external
          x-cru-required-when: true
        condition_status:
          description: verified (Verified), client_reserves (Client Reserve) or apd (As per description). For external,
            it defaults to, and cannot exceed, the level Cru set for your account. For supplier, it defaults to
            verified, or to apd when duty_paid is true, which takes nothing else. Only with stock_type external
            or supplier.
          type: string
          enum:
          - verified
          - client_reserves
          - apd
          x-cru-when:
            stock_type:
            - external
            - supplier
        condition_text:
          description: What buyers are told about the condition. Required for apd, and refused for verified; client_reserves
            may have it. Duty-paid stock says “Duty Paid in the UK” unless you give it. Only with stock_type supplier.
          type: string
          maxLength: 200
          x-cru-when:
            stock_type:
            - supplier
        duty_paid:
          description: true when the duty has been paid, which makes the offer apd. Defaults to false, in bond.
            Only with stock_type supplier.
          type: boolean
          x-cru-when:
            stock_type:
            - supplier
        cost:
          description: What you paid per unit, for your records. Only with stock_type external.
          type: number
          minimum: 0
          exclusiveMinimum: true
          x-cru-when:
            stock_type:
            - external
        inbond_address_id:
          description: 'The inbond warehouse the wine is in now, from GET /warehouses/inbond. Leave it out if you
            are not sure where the wine is: Cru records it as not sure, as the website’s “Not Sure” option does.
            Only with stock_type external.'
          type: integer
          minimum: 1
          x-cru-when:
            stock_type:
            - external
