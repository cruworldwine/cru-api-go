      - quantity
      - price
      - total
      - currency
      - reference
      - traded_at
      - cru_id
      - transfer_ref
      - cost
      - sold_price
      - commission_percent
      - commission
      - settlement_fee
      - net_proceeds
      - profit_loss
      - profit_loss_percent
