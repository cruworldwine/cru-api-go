  /bids:
    get:
      operationId: listBids
      summary: List your bids
      description: |-
        Your own bids on every Cru site, newest first — the live ones unless you ask for others — priced in your market’s currency, with what matched and its orders.

        **Live bids only, unless you ask.** Without status, only live bids come back. Name the ones you want, such as status=matched,complete, or list all six to see every bid.
      tags:
      - Your bids
      x-cru-sdk:
        resource: bids
        method: list
