  /trades/sales:
    get:
      operationId: listSales
      summary: List your sales
      description: |-
        What you have sold on Cru, one unit at a time, newest first: commission, what you received and profit.

        **One sale per unit.** Each unit sold is its own sale, with quantity 1, its cru_id and no order number. sold_price, commission and settlement_fee take the sale down to net_proceeds, what you received, and profit_loss sets that against cost.

        **Wine held outside Cru, on its way to Cru.** Once it sells, wine held outside Cru goes to the Cru warehouse deliver_to names, by deliver_by. status says how far it has got: transfer_needed until a transfer to Cru is booked, then awaiting_transfer, with transfer_ref naming the transfer; on_purchase_order while it is due in on a purchase order; and delivered_to_cru once it is there. Wine stored with Cru has no deliver_to, and is always delivered_to_cru.
      tags:
      - Your portfolio
      x-cru-sdk:
        resource: trades
        method: list_sales
        paged: true
      x-cru-scope: trades:read
      security:
      - ClientKey: []
        ClientSecret: []
      - OAuth:
        - trades:read
      parameters:
      - name: lwin
        in: query
        required: false
        description: 'Only these wines: up to 20 comma-separated 18-digit LWIN18 codes.'
        style: form
        explode: false
        schema:
