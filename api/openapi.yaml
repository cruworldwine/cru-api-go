        in: query
        required: false
        description: 'Only sales of wine held outside Cru going to any of these Cru warehouses, comma-separated:
          UK_DRAK, HK_KERRY, SG_TOLL, FR_DARTESS, US_NAPA. Wine stored with Cru matches none. An unknown code is
          refused with VALIDATION_INVALID_VALUE.'
