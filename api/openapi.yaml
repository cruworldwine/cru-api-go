          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBidsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: placeBid
      summary: Place a bid
      description: |-
        Place a bid to buy a wine at your own price per unit. It rests on Cru for 90 days and fills when a seller accepts it.

        **To buy at the asking price, use an offer.** This places a resting bid. To buy an offer straight away at its price, POST /market/offers/{code}/buy.

        **The bid must fit your bidding allowance.** price × quantity above the account’s allowance is refused with TRADE_REFUSED, and its message gives both amounts. So is an untraded wine, or an account that cannot bid.
      tags:
      - Your bids
      x-cru-sdk:
        resource: bids
        method: place
      x-cru-scope: bids:write
      security:
      - ClientKey: []
        ClientSecret: []
      - OAuth:
        - bids:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceBidRequest'
      x-cru-action: bid.place
      responses:
        '201':
          description: 'A partner credential gets 201 and the bid it placed. A connected app gets 202 and data.confirmation:
            nothing has happened yet.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceBidResponse'
        '202':
          description: 'A connected app''s write is staged, not done: confirm it with POST /confirmations/{code}
            once the customer agrees.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
