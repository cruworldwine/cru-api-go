      - name: lwin
        in: query
        required: false
        description: 'Only these wines: up to 20 comma-separated 18-digit LWIN18 codes.'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          maxItems: 20
      - name: wine_name
        in: query
        required: false
        description: 'Only wines whose name contains every word given, as GET /wines matches a name, such as “Lafite
          2010”: one to six words of two or more characters. Anything else is refused with VALIDATION_INVALID_VALUE.'
        schema:
          type: string
          maxLength: 100
      - name: current_location_code
        in: query
        required: false
        description: 'Only portfolio lines of wine stored now at any of these, as warehouse.current_location_code
          gives them, comma-separated, such as UK_DRAK,IB_20,ADDR_123: a Cru warehouse code (UK_DRAK, HK_KERRY,
          SG_TOLL, FR_DARTESS, US_NAPA), IB_ and the inbond_address_id of an inbond warehouse outside Cru, or ADDR_
          and the id of your own address. Case-insensitive. Unlike deliverable_warehouse_code, it says where the
          wine is, not where it is delivered from. An ADDR_ code that is not one of your addresses matches nothing.
          Anything else is refused with VALIDATION_INVALID_VALUE.'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          maxItems: 50
      - name: deliverable_warehouse_code
        in: query
        required: false
        description: 'Only portfolio lines whose warehouse.deliverable_warehouse_code is any of these Cru warehouses,
          comma-separated: UK_DRAK, HK_KERRY, SG_TOLL, FR_DARTESS, US_NAPA. An unknown code is refused with VALIDATION_INVALID_VALUE.'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - UK_DRAK
            - HK_KERRY
            - SG_TOLL
            - FR_DARTESS
            - US_NAPA
      - name: stock_type
        in: query
        required: false
        description: Only portfolio lines of these stock types, comma-separated, such as cru,external. A stock_type
          is cru, external, supplier or bpo, and only a corporate supplier has the last two. Any other value is
          refused with VALIDATION_UNSUPPORTED_VALUE.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - cru
            - external
            - supplier
            - bpo
      - name: stock_status
        in: query
        required: false
        description: 'Only portfolio lines with any of these stock_status values, comma-separated: in_stock, in_transit
          or due_in. Case-insensitive. It matches the stock_status each line shows, so a supplier’s own offers and
          its BPO stock are due_in. Any other value is refused with VALIDATION_UNSUPPORTED_VALUE.'
        style: form
        explode: false
        schema:
          type: array
