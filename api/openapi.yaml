          type: object
          required:
          - street
          - city
          - region
          - postcode
          - country
          properties:
            street:
              description: Street lines, comma-separated.
              type: string
              nullable: true
            city:
              description: City.
              type: string
              nullable: true
            region:
              description: Region or county, when there is one.
              nullable: true
              type: string
            postcode:
              description: Postcode.
              type: string
              nullable: true
            country:
              description: ISO 3166-1 alpha-2 country code.
              type: string
              nullable: true
        phone:
          description: Contact number.
          type: string
          nullable: true
        bond_references:
          description: Excise and bond references to quote when delivering in bond.
          type: array
          items:
            type: string
        delivery_instructions:
          description: Plain text, with line breaks as \n.
          type: string
          nullable: true
        sells_your_inbond_wine:
          description: 'Whether wine you hold outside Cru can be sold through it: the warehouse_code values POST
