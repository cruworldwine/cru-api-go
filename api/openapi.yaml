  /market/offers/{code}/buy:
    post:
      operationId: buyMarketOffer
      summary: Buy an offer
      description: |-
        Buy one offer on Cru’s market now, at its asking price, paid from your Cru account credit or on invoice and kept in your Cru storage.

        **The offer you name, and bids:write as well.** There is no “buy at the lowest offer”: pick one from GET /market/wines/{lwin18}/offers. The purchase needs bids:write besides orders:write. To sell into a bid instead, POST /market/bids/{code}/sell.

        **A partner key should send max_price.** A partner’s purchase has no preview, so max_price is what holds the price you read from the book. If the offer costs more, nothing is bought.

        **Paid from credit or on invoice, never by card.** It goes through the Cru website’s own Buy now, paid from your Cru account credit, or on invoice if your account has invoice terms. The wine is kept in your Cru storage. If neither covers the total, nothing is bought, and the message says how much credit is missing.
      tags:
      - Buy and sell
      x-cru-sdk:
        resource: market
        method: buy_offer
      x-cru-scope: orders:write
      security:
      - ClientKey: []
        ClientSecret: []
      - OAuth:
        - orders:write
      parameters:
      - name: code
        in: path
        required: true
        description: The offer’s opaque code, from GET /market/offers. URL-encode it as a single path segment.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyMarketOfferRequest'
      x-cru-action: bid.buy
      responses:
        '201':
          description: The order placed. A connected app gets 202 and a confirmation whose preview quotes the purchase
            and how it is paid.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyMarketOfferResponse'
        '202':
          description: 'A connected app''s write is staged, not done: confirm it with POST /confirmations/{code}
            once the customer agrees.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /market/bids/{code}/sell:
    post:
      operationId: sellToMarketBid
      summary: Sell into a bid
      description: |-
        Sell into one bid on Cru’s market now, at its price after commission, credited to your Cru account: a line of your portfolio, or new stock.

        **The bid you name, and offers:write as well.** There is no “sell at the best bid”: pick one from GET /market/wines/{lwin18}/bids by its requirements. The sale needs offers:write besides orders:write. To buy an offer instead, POST /market/offers/{code}/buy.

        **A partner key should send min_price.** A partner’s sale has no preview, so min_price is what holds the price you read from the book. If the bid pays less, nothing is sold.

        **Wine held outside Cru, not in your portfolio yet.** For accounts Cru has set up to sell it, as the website’s Sell Now does: send stock_type external and warehouse_code, with no portfolio_id, and Cru creates the units at that warehouse and fills the bid with them at once — or deletes them again, and sells nothing, if the fill fails. You set no price: you receive the bid’s price less that warehouse’s settlement fee — its settlement_fee in GET /warehouses, such as GBP 6.00 per unit at UK_DRAK — and a corporate account pays none. Selling confirms the wine is free from material faults, in its original packaging, in a professional warehouse and not duty paid, and that you will transfer it to that warehouse; Cru emails you the purchase order. A bid that takes landed stock only cannot be filled this way.

        **Your own stock, as a supplier.** A supplier whose offer feed Cru imports can sell stock that is not in its feed: send stock_type supplier, with no portfolio_id. Cru adds an offer of just that quantity to your feed, at the feed’s warehouse, verified and not duty paid, and fills the bid with it at once, so selling it all leaves nothing on sale. If it cannot fill the bid, or the fill fails, it is taken back and nothing is sold. Supplier stock, new or a line of your portfolio, fills only bids placed on Cru.
      tags:
      - Buy and sell
      x-cru-sdk:
        resource: market
        method: sell_to_bid
      x-cru-scope: orders:write
      security:
      - ClientKey: []
        ClientSecret: []
      - OAuth:
        - orders:write
      parameters:
      - name: code
        in: path
        required: true
        description: The bid’s opaque code, from GET /market/bids. URL-encode it as a single path segment.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellToMarketBidRequest'
      x-cru-action: offer.sell
      responses:
        '200':
          description: What was sold, and from what. A connected app gets 202 and a confirmation whose preview quotes
            the sale.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellToMarketBidResponse'
        '202':
          description: 'A connected app''s write is staged, not done: confirm it with POST /confirmations/{code}
            once the customer agrees.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
