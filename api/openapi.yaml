    get:
      operationId: listOffers
      summary: List your offers
      description: |-
        Your portfolio’s listed lines, by wine: what buyers pay and what you receive for each.

        **Your portfolio, listed lines only.** GET /offers answers as GET /portfolio?is_listed=true does: the same wines, lines and fields, and the same filters but is_listed, with the wines under data.offers rather than data.wines. A wine’s total_quantity is the units listed.

        **Filters narrow each wine too.** wine_name, current_location_code, deliverable_warehouse_code, stock_type, stock_status, duty_paid and condition_status combine with each other and with lwin. They choose the portfolio lines shown inside each wine, as well as which wines appear.

        **offers:read shows what the wine cost.** GET /offers and GET /offers/{code} need offers:read, not portfolio:read, yet their lines carry everything GET /portfolio’s do, pricing.cost included: a credential that can read your listings sees what the listed wine cost you.
